# Pembaruan dependensi otomatis. CI (.github/workflows/tests.yml) menguji setiap PR.
# Package tema privat: butuh Dependabot secret FILAMENT_SHADCN_TOKEN (terpisah dari secret Actions):
#   gh secret set FILAMENT_SHADCN_TOKEN --app dependabot --repo mehuli-id/<repo>
version: 2
registries:
  github-filament-shadcn:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{ secrets.FILAMENT_SHADCN_TOKEN }}

updates:
  - package-ecosystem: composer
    directory: /
    registries: [github-filament-shadcn]
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      tema:
        patterns: ['mehuli/filament-shadcn']
      filament:
        patterns: ['filament/*', 'livewire/*']
      laravel:
        patterns: ['laravel/*']
      lainnya-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ['*']
