# Pembaruan dependensi otomatis. CI (.github/workflows/tests.yml) menguji setiap PR.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      tema:
        patterns: ['mehuli/filament-shadcn']
      filament:
        patterns: ['filament/*', 'livewire/*']
      laravel:
        patterns: ['laravel/*']
      lainnya-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Jakarta
    groups:
      minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Jakarta
    groups:
      actions:
        patterns: ['*']
